<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Intake | FindMySpecialist</title><link rel="stylesheet" href="/css/styles.css"></head><body><header><h1>FindMySpecialist</h1><nav><a href="/index.html">Home</a><a href="/login.html">Login</a><a href="/signup.html">Sign Up</a><a href="/intake.html">Symptoms</a><a href="/match.html">Match</a><a href="/specialists.html">Find</a><a href="/details.html">Details</a></nav></header><main><div class="panel"><h2>User Intake</h2><form id="intakeForm"><label>ZIP code (Minnesota demo area)</label><input id="zip" name="zip" type="text" inputmode="numeric" pattern="[0-9]{5}" maxlength="5" placeholder="e.g. 55106" required><label>Age</label><input id="age" name="age" type="number" min="1" max="120" required><label>Insurance provider</label><select id="insuranceProvider" name="insuranceProvider"></select><label>Insurance plan</label><select id="insurancePlan" name="insurancePlan"></select><label>Symptoms</label><input id="symptomSearch" maxlength="100" placeholder="Search symptoms by name"><div id="symptomChoices" class="choices" style="margin-top:15px"></div><p id="selectedCount">0 of 3 selected</p><button type="submit" id="submitSymptoms">Next: Match Specialty</button></form><div id="message" role="status" aria-live="polite"></div></div></main><footer>Demo providers only • No real booking or medical diagnosis</footer><script src="/js/app.js"></script></body></html>
